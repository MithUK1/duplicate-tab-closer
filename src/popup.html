<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #111827;
      --muted: #6b7280;
      --card: #f3f4f6;
      --hover: #e5e7eb;
      --border: #e5e7eb;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --ok: #15803d;
      --danger: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124;
        --fg: #e8eaed;
        --muted: #9aa0a6;
        --card: #2d2e31;
        --hover: #3c4043;
        --border: #3c4043;
        --accent: #3b82f6;
        --accent-hover: #60a5fa;
        --ok: #4ade80;
        --danger: #f87171;
      }
    }

    * { box-sizing: border-box; }
    body {
      width: 320px; margin: 0; padding: 14px;
      font: 13.5px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--fg);
    }
    [hidden] { display: none !important; }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
    button:disabled { cursor: default; }
    svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* header */
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    header img { width: 32px; height: 32px; border-radius: 8px; }
    header h1 { margin: 0; font-size: 14px; font-weight: 650; }
    header p { margin: 1px 0 0; font-size: 12px; color: var(--muted); }

    /* count pill */
    .pill {
      min-width: 24px; height: 20px; padding: 0 7px; border-radius: 10px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 650; background: var(--hover); color: var(--fg);
    }

    /* action buttons */
    .actions { display: grid; gap: 8px; margin-bottom: 10px; }
    .btn {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      width: 100%; padding: 10px 12px; border-radius: 10px;
      background: var(--card); border: 1px solid var(--border); font-weight: 550;
      transition: background .12s;
    }
    .btn:hover:not(:disabled) { background: var(--hover); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn.primary .pill { background: rgba(255,255,255,.25); color: #fff; }
    .btn:disabled { opacity: .5; }
    .btn:disabled .pill { opacity: .7; }

    /* menu rows */
    .menu { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 9px 12px; text-align: left; transition: background .12s;
    }
    .item + .item { border-top: 1px solid var(--border); }
    .item:hover:not(:disabled) { background: var(--card); }
    .item:disabled { opacity: .45; }
    .item .icon { color: var(--muted); }
    .item .txt { flex: 1; min-width: 0; }
    .item .txt b { display: block; font-weight: 550; }
    .item .txt small { display: block; color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .meta { color: var(--muted); display: flex; align-items: center; gap: 4px; font-size: 12px; }

    /* switch row */
    .switch-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 2px 4px; cursor: pointer; user-select: none;
    }
    .switch {
      appearance: none; -webkit-appearance: none; margin: 0; flex: none;
      width: 36px; height: 20px; border-radius: 10px; position: relative;
      background: #9ca3af; cursor: pointer; transition: background .15s;
    }
    .switch::after {
      content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
      border-radius: 50%; background: #fff; transition: transform .15s;
    }
    .switch:checked { background: var(--accent); }
    .switch:checked::after { transform: translateX(16px); }

    #status { min-height: 18px; margin: 8px 2px 0; font-size: 12.5px; color: var(--ok); }

    footer {
      display: flex; gap: 6px; margin-top: 8px; padding-top: 10px;
      border-top: 1px solid var(--border); font-size: 12.5px;
    }
    footer button { color: var(--muted); padding: 3px 6px; border-radius: 6px; }
    footer button:hover { color: var(--fg); background: var(--card); }

    /* submenu */
    .subhead { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
    .subhead h2 { flex: 1; margin: 0; font-size: 14px; font-weight: 650; }
    .iconbtn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 8px; color: var(--muted); }
    .iconbtn:hover { background: var(--card); color: var(--fg); }
    .textbtn { padding: 4px 10px; border-radius: 8px; color: var(--danger); font-weight: 550; }
    .textbtn:hover:not(:disabled) { background: var(--card); }
    .textbtn:disabled { opacity: .4; }

    ul { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow-y: auto; }
    li { display: flex; align-items: center; gap: 10px; padding: 8px 8px; border-radius: 8px; cursor: pointer; }
    li:hover { background: var(--card); }
    li img, li .ph { width: 16px; height: 16px; flex: none; border-radius: 3px; }
    li .ph { background: var(--hover); }
    li .txt { flex: 1; min-width: 0; }
    li .txt b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li .txt small { display: block; color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li .when { color: var(--muted); font-size: 11.5px; flex: none; }
    li.empty { color: var(--muted); cursor: default; justify-content: center; padding: 22px 8px; }
    li.empty:hover { background: none; }
  </style>
</head>
<body>
  <div id="main">
    <header>
      <img src="icons/icon48.png" alt="">
      <div>
        <h1>Duplicate Tab Closer</h1>
        <p id="summary">&nbsp;</p>
      </div>
    </header>

    <div class="actions">
      <button class="btn primary" id="closeAll" disabled>
        <span>Close all duplicates</span><span class="pill" id="allCount">0</span>
      </button>
      <button class="btn" id="closeCurrent" disabled>
        <span>Close duplicates of this tab</span><span class="pill" id="curCount">0</span>
      </button>
    </div>

    <div class="menu">
      <button class="item" id="undo" disabled>
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg>
        <span class="txt"><b>Reopen last closed duplicate</b><small id="undoNext">Nothing to reopen</small></span>
        <span class="pill" id="undoCount">0</span>
      </button>
      <button class="item" id="openRecent">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span class="txt"><b>Recently closed</b></span>
        <span class="meta"><span id="recentCount"></span><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>
      </button>
    </div>

    <label class="switch-row">
      <span>Auto-close new duplicates</span>
      <input type="checkbox" class="switch" id="autoClose">
    </label>

    <div id="status" aria-live="polite"></div>

    <footer>
      <button id="history">Full history</button>
      <button id="settings">Settings</button>
    </footer>
  </div>

  <div id="sub" hidden>
    <div class="subhead">
      <button class="iconbtn" id="back" title="Back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <h2>Recently closed</h2>
      <button class="textbtn" id="clear">Clear</button>
    </div>
    <ul id="recent"></ul>
    <footer>
      <button id="history2">Full history</button>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
